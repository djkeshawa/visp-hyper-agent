name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build before test: hooks-command, mcp-server, pack-smoke, and
      # tool-asset-installer suites read dist/ and templates/ from disk.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test
