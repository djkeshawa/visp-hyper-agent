name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not the test suite's build precondition — that lives in the suite
      # itself (tests/setup/build-dist.ts, registered as Vitest globalSetup),
      # so a developer running `vitest` directly gets it too. This step is here
      # only so a broken build fails as "build", before ~1270 tests run.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

  # The Kit<->Hyper contract is the one thing neither repository can verify
  # alone. `tests/visp-binary-contract.test.ts` self-skips unless a sibling Kit
  # build and an initialized `.visp/` are both present, and neither exists in
  # the `check` job -- so until this job, the real contract was never exercised
  # automatically, only by hand.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: visp-hyper-agent

      # visp-kit is a private repository, and the default GITHUB_TOKEN is
      # scoped to this one, so the cross-repository checkout needs a PAT with
      # `repo` scope stored as VISP_KIT_TOKEN. Without it the contract cannot
      # be verified -- say so loudly rather than reporting a green tick for a
      # check that never ran.
      - name: Check for the cross-repository token
        id: kit_token
        env:
          VISP_KIT_TOKEN: ${{ secrets.VISP_KIT_TOKEN }}
        run: |
          if [ -n "$VISP_KIT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Kit contract NOT verified::VISP_KIT_TOKEN is not set, so the private visp-kit repository cannot be checked out. The Kit<->Hyper contract was not exercised in this run. Add a PAT with repo scope as the VISP_KIT_TOKEN secret to enable it."
          fi

      - uses: actions/checkout@v4
        if: steps.kit_token.outputs.available == 'true'
        with:
          repository: djkeshawa/visp-kit
          ref: develop
          token: ${{ secrets.VISP_KIT_TOKEN }}
          path: visp-kit

      - uses: pnpm/action-setup@v4
        if: steps.kit_token.outputs.available == 'true'

      - uses: actions/setup-node@v4
        if: steps.kit_token.outputs.available == 'true'
        with:
          node-version: 22

      # The test resolves `../visp-kit/dist/index.js` relative to the Hyper
      # checkout, so Kit must be built and sit beside it.
      - name: Build Visp Kit
        if: steps.kit_token.outputs.available == 'true'
        working-directory: visp-kit
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Visp Hyper Agent
        if: steps.kit_token.outputs.available == 'true'
        working-directory: visp-hyper-agent
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # `.visp/` is gitignored, so the contract test has no Kit artifacts to
      # read until a project is initialized inside the checkout.
      - name: Initialize a Visp project for the contract fixture
        if: steps.kit_token.outputs.available == 'true'
        working-directory: visp-hyper-agent
        run: node ../visp-kit/dist/index.js init . --agent none

      # Run through the pair check rather than calling vitest directly.
      # `tests/visp-binary-contract.test.ts` is guarded by `describe.skipIf`, so
      # if the Kit build or the `.visp/` init above quietly produced nothing,
      # vitest reports `success: true` with every test pending and this job goes
      # green having verified nothing. The pair check treats a skip as a
      # failure, and writes a record naming the two commits it exercised and the
      # surface that ran it. See docs/pair-verification.md.
      - name: Verify the Kit<->Hyper pair
        if: steps.kit_token.outputs.available == 'true'
        working-directory: visp-hyper-agent
        run: node scripts/pair-check.mjs --record pair-check.json

      # The record is the artifact that distinguishes "verified in CI" from
      # "verified on somebody's laptop". Uploaded even on failure -- a
      # not-verified record with its blockers is the useful one.
      - name: Upload the pair-check record
        if: always() && steps.kit_token.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pair-check-record
          path: visp-hyper-agent/pair-check.json
          if-no-files-found: warn
