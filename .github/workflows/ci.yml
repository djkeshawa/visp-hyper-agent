name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # tests/integration/memory/memory-contract-integration.test.ts drives the REAL published
      # visp-memory binary through Hyper's real contract client, and it FAILS
      # rather than skips when that binary is absent — deliberately, because a
      # silently skipped integration test is how a seam goes unchecked for
      # months. This job never installed it, so those six tests had failed on
      # every platform since the file was added, and the matrix reported the
      # seam as broken while it was merely unbuilt.
      #
      # Installing it is the fix the test asks for. Skipping it instead would
      # replace a red that means something with a green that means less.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # DELIBERATELY UNPINNED. This test exists to catch Memory's envelope
      # drifting from what Hyper's parser accepts, so pinning the version would
      # remove the only thing it detects. The cost is real and is named here
      # rather than discovered later: a visp-memory release can turn this
      # matrix red without visp-hyper-agent changing. That is the coupling
      # LC-34 is about, and it is accepted because the alternative is a seam
      # check that cannot fail.
      - run: python -m pip install --upgrade visp-memory

      - run: pnpm install --frozen-lockfile

      # Not the test suite's build precondition — that lives in the suite
      # itself (tests/setup/build-dist.ts, registered as Vitest globalSetup),
      # so a developer running `vitest` directly gets it too. This step is here
      # only so a broken build fails as "build", before ~1270 tests run.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

  # THE COVERAGE GATE. `vitest.config.ts` carries coverage thresholds, and until
  # this job existed nothing hosted ever ran `test:coverage` — the matrix above
  # runs `pnpm test`, which does not evaluate a threshold. The numbers were
  # therefore enforced on whichever laptop happened to type `pnpm check`, which
  # is to say nowhere.
  #
  # ONE PLATFORM, DELIBERATELY, and it is the platform the thresholds were
  # measured on. Coverage is not portable: `src/core/executable-resolver.ts`
  # spends most of its body behind `if (!WINDOWS)`, so the same suite covers
  # measurably different branches on Windows and on Linux. Running the threshold
  # check across the matrix would pin four jobs to one job's measurement and
  # produce failures that mean "different platform", not "coverage regressed".
  # Windows and Node 24 are not less checked for it — they run the whole suite
  # in `check` above; they are only not asked to reproduce a Linux percentage.
  #
  # The setup is kept identical to `check` on purpose: visp-memory and the build
  # are preconditions of the suite, not of coverage, and a job that differs in
  # setup would eventually disagree with `check` for a reason that is not the
  # code.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # See the note in `check`: the memory contract test fails rather than
      # skips without the real binary, deliberately.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade visp-memory

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:coverage

  # THE PAIR CHECK. `tests/integration/kit/visp-binary-contract.test.ts` is the only test that
  # drives a real Kit binary, and it self-skips without one — so the `check`
  # job above, which has no Kit, verifies the seam not at all and says nothing
  # about it either way.
  #
  # This job used to check out the private `djkeshawa/visp-kit` behind a
  # `VISP_KIT_TOKEN` secret, with every step conditional on that secret being
  # present. Forks and outside contributors cannot have it, so for anyone but
  # the owner every step skipped and the job still reported success: a green
  # tick standing for a check nobody outside could run. That job now lives in
  # `pair-source.yml`, is manual-only, and fails loudly without the token.
  #
  # What runs here instead needs no secret and no visp-kit checkout, because
  # visp-kit's *source* is private but its *package* is public: the check
  # installs the Kit npm actually serves and drives that artifact. It is
  # stronger evidence, not weaker — it exercises the pair a user gets rather
  # than two development branches — and anyone can reproduce it from a clone
  # with `pnpm test:pair:served`.
  pair:
    strategy:
      fail-fast: false
      matrix:
        # Linux only, deliberately: this pair has never been observed passing
        # on Windows or macOS, and a matrix entry is a claim. docs/pair-verification.md
        # lists what is still uncovered.
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--init-if-missing` initializes `.visp/` with the served Kit, which a
      # fresh checkout does not have (`.visp/` is gitignored). It never touches
      # an existing one. The pair check treats a skipped contract test as a
      # failure, so this step cannot go green having verified nothing.
      - name: Verify the pair npm serves
        run: node scripts/pair-check.mjs --kit-npm visp-kit@latest --init-if-missing --record pair-check.json

      # The record is what distinguishes "verified in CI" from "verified on
      # somebody's laptop", and it names the tarball and integrity hash of the
      # exact Kit artifact that ran. Uploaded even on failure — a not-verified
      # record with its blockers is the useful one.
      - name: Upload the pair-check record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-check-record-node${{ matrix.node }}
          path: pair-check.json
          if-no-files-found: warn
