name: H04B Windows validation

"on":
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    name: Windows evidence
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_DRAFT: ${{ github.event.pull_request.draft }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable candidate inputs
        shell: pwsh
        run: >
          & .github/validation/h04b-windows-validate.ps1
          -Phase Preflight
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -RunnerTemp $env:RUNNER_TEMP

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Run H04B validation
        shell: pwsh
        run: >
          & .github/validation/h04b-windows-validate.ps1
          -Phase Validate
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -RunnerTemp $env:RUNNER_TEMP
